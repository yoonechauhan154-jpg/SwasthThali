[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# SPA fallback for any routes not pre-rendered
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false
